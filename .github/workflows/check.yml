name: Validate game
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-shift-web
          path: dist/
